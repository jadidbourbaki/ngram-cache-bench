[project]
name = "ngram-cache-bench"
version = "0.1.0"
description = "Benchmarks of the n-gram caches in llama.cpp"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.2",
    "pyarrow==25.0.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "ty==0.0.84",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
